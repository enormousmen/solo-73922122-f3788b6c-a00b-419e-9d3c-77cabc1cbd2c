services:
  permit-api:
    build: .
    image: restart-permit-api:latest
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/permits.db
      MANIFEST_PATH: /app/manifest.json
      # 恢复编号：从旧 SQLite 备份恢复、库中可能缺少执行器已领走的许可时，
      # 设为一个新的唯一编号（如 rec-2026-11-20-01）再启动，例如：
      #   RECOVERY_ID=rec-2026-11-20-01 docker compose up -d
      # 该编号完成恢复前暂停发新许可（探活、查询、结单照常）；
      # 留空/不设置 = 正常发证。新一轮恢复换一个新编号即可。
      RECOVERY_ID: "${RECOVERY_ID:-}"
    volumes:
      # SQLite 数据落盘到命名卷，服务重启后许可与最新探活记录保留
      - permit-data:/data
      # 固定分片清单，只读挂载；改了清单需重启服务生效
      - ./manifest.json:/app/manifest.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  permit-data:
